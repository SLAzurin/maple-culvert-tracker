name: Check MapleStory Ranking API

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ranking-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version-file: go.mod
      - name: Build the ranking API test
        run: go test -c -o "$RUNNER_TEMP/ranking.test" ./internal/api/helpers
      - name: Check the live ranking endpoint
        id: check-ranking
        working-directory: internal/api/helpers
        run: '"$RUNNER_TEMP/ranking.test" -test.run "^TestFetchCharacterData$" -test.v'
      - name: Notify Discord of a ranking API failure
        if: ${{ failure() && steps.check-ranking.outcome == 'failure' }}
        env:
          DISCORD_WEBHOOK_API_FAIL: ${{ secrets.DISCORD_WEBHOOK_API_FAIL }}
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_API_FAIL" ]]; then
            echo '::warning::DISCORD_WEBHOOK_API_FAIL is unset. Discord alert skipped.'
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '{"content":"The MapleStory Ranking API appears to be broken. The live check failed. Workflow run: %s"}' "$run_url" |
            curl --fail --silent --show-error --max-time 15 --output /dev/null \
              --header 'Content-Type: application/json' --data-binary @- -- "$DISCORD_WEBHOOK_API_FAIL"
